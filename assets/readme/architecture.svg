<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Lunaa Adaptive AOD System Architecture</title>
  <desc id="archDesc">Architecture diagram showing LSPosed hook in SystemUI, reflection bridge, root receiver, and display driver interaction</desc>
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FFC449" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399" />
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#070809" stroke="#21262D" stroke-width="1.5" />

  <g transform="translate(48, 36)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">How It Works: End-to-End Pipeline</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8B949E">From ambient light perception to direct hardware AMOLED panel latching with zero UDFPS lockup.</text>
  </g>

  <!-- Step 1: SystemUI Hook -->
  <g transform="translate(48, 96)">
    <rect width="250" height="210" rx="16" fill="url(#boxGrad)" stroke="#30363D" stroke-width="1.5" />
    <rect width="250" height="36" rx="16" fill="#1F242C" />
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFC449">1. LSPosed In SystemUI</text>
    
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F0F6FC">DozeScreenBrightness</text>
    <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Hooks transitionTo &amp; doze</text>
    <text x="16" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Binds mSensorManager</text>
    <text x="16" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Subscribes to ambient lux</text>
    
    <rect x="16" y="152" width="218" height="38" rx="8" fill="#111418" stroke="#FFC449" stroke-opacity="0.3" stroke-width="1" />
    <text x="26" y="176" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#FFC449">Perceptual Curve Scaling</text>
  </g>

  <!-- Flow Arrow 1 -->
  <line x1="306" y1="200" x2="336" y2="200" stroke="#FFC449" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Runtime Resolver & Bridge -->
  <g transform="translate(344, 96)">
    <rect width="250" height="210" rx="16" fill="url(#boxGrad)" stroke="#30363D" stroke-width="1.5" />
    <rect width="250" height="36" rx="16" fill="#1F242C" />
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#38BDF8">2. Dual Reflection Bridge</text>
    
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F0F6FC">RuntimeFieldResolver</text>
    <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Resolves mDisplayManager</text>
    <text x="16" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Dynamic type detection:</text>
    <text x="24" y="126" font-family="ui-monospace, monospace" font-size="11" fill="#38BDF8">float 0..1 (AOSP 12–16)</text>
    <text x="24" y="142" font-family="ui-monospace, monospace" font-size="11" fill="#8B949E">int 0..255 (Legacy/Vendor)</text>

    <rect x="16" y="156" width="218" height="34" rx="8" fill="#111418" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <text x="26" y="178" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#38BDF8">DisplayPowerController</text>
  </g>

  <!-- Flow Arrow 2 -->
  <line x1="602" y1="200" x2="632" y2="200" stroke="#FFC449" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Root Bridge Daemon -->
  <g transform="translate(640, 96)">
    <rect width="250" height="210" rx="16" fill="url(#boxGrad)" stroke="#30363D" stroke-width="1.5" />
    <rect width="250" height="36" rx="16" fill="#1F242C" />
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#A78BFA">3. KernelSU / Root Bridge</text>
    
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F0F6FC">RootHbmBridgeReceiver</text>
    <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Authenticates SystemUI UID</text>
    <text x="16" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Latches HBM under &gt;1500 lux</text>
    <text x="16" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Resets logical node (0)</text>

    <rect x="16" y="152" width="218" height="38" rx="8" fill="#111418" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1" />
    <text x="24" y="176" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#A78BFA">/sys/.../notify_fppress</text>
  </g>

  <!-- Flow Arrow 3 -->
  <line x1="898" y1="200" x2="928" y2="200" stroke="#34D399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Step 4: Hardware Panel Latch -->
  <g transform="translate(936, 96)">
    <rect width="216" height="210" rx="16" fill="url(#boxGrad)" stroke="#34D399" stroke-width="1.5" />
    <rect width="216" height="36" rx="16" fill="#132B20" />
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#34D399">4. Panel Hardware</text>
    
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F0F6FC">Samsung AMOLED</text>
    <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Peak ~800 nits latch</text>
    <text x="16" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Zero screen flicker</text>
    <text x="16" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Optical sensor ready</text>

    <rect x="16" y="152" width="184" height="38" rx="8" fill="#0C2016" stroke="#34D399" stroke-opacity="0.4" stroke-width="1" />
    <text x="24" y="176" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#34D399">✓ Full UDFPS Unlock</text>
  </g>
</svg>