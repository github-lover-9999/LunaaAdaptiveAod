<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="presetsTitle presetsDesc">
  <title id="presetsTitle">Lunaa Adaptive AOD Presets and Extra Bright Mode</title>
  <desc id="presetsDesc">4-card comparison of Dim, Balanced, Bright, and Extra Bright HBM modes</desc>
  <defs>
    <linearGradient id="pCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0E1217" />
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="20" fill="#070809" stroke="#21262D" stroke-width="1.5" />

  <!-- Card 1: DIM -->
  <g transform="translate(40, 24)">
    <rect width="264" height="212" rx="14" fill="url(#pCard)" stroke="#30363D" stroke-width="1.2" />
    <rect width="264" height="32" rx="14" fill="#1C2128" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#9BA1A6">🌙 DIM (Night Mode)</text>
    
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#FFFFFF">20% – 40%</text>
    <text x="14" y="88" font-family="ui-monospace, monospace" font-size="11" fill="#8B949E">~15 – 35 nits</text>
    
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#C9D1D9">• Soft, zero-glare night clock</text>
    <text x="14" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#C9D1D9">• Perfect for dark bedrooms</text>
    <text x="14" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Zero battery drain</text>
  </g>

  <!-- Card 2: BALANCED -->
  <g transform="translate(324, 24)">
    <rect width="264" height="212" rx="14" fill="url(#pCard)" stroke="#FFC449" stroke-width="1.5" />
    <rect width="264" height="32" rx="14" fill="#2E2412" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFC449">⚡ BALANCED (Daily)</text>
    
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#FFC449">50% – 76%</text>
    <text x="14" y="88" font-family="ui-monospace, monospace" font-size="11" fill="#8B949E">~45 – 135 nits</text>
    
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#C9D1D9">• 50% comfortable night floor</text>
    <text x="14" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#C9D1D9">• Clear in normal room light</text>
    <text x="14" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Up to 100% on 20k lux</text>
  </g>

  <!-- Card 3: BRIGHT -->
  <g transform="translate(608, 24)">
    <rect width="264" height="212" rx="14" fill="url(#pCard)" stroke="#38BDF8" stroke-width="1.5" />
    <rect width="264" height="32" rx="14" fill="#132332" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">☀️ BRIGHT (Daylight)</text>
    
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#38BDF8">100% Fixed</text>
    <text x="14" y="88" font-family="ui-monospace, monospace" font-size="11" fill="#8B949E">215 – 380 nits curve</text>
    
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#C9D1D9">• Maximum daytime clarity</text>
    <text x="14" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#C9D1D9">• Standard AOD upper limit</text>
    <text x="14" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8B949E">• Pre-arms HBM for sunlight</text>
  </g>

  <!-- Card 4: EXTRA BRIGHT (HBM) -->
  <g transform="translate(892, 24)">
    <rect width="264" height="212" rx="14" fill="url(#pCard)" stroke="#FF5500" stroke-width="1.5" />
    <rect width="264" height="32" rx="14" fill="#2E1204" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FF5500">🔥 EXTRA BRIGHT (HBM)</text>
    
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#FF5500">~800 Nits</text>
    <text x="14" y="88" font-family="ui-monospace, monospace" font-size="11" fill="#FFA533">Low (50%) | Med | Max (100%)</text>
    
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#C9D1D9">• Direct sunlight (>1500 lux)</text>
    <text x="14" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#C9D1D9">• Panel-level hardware HBM</text>
    <text x="14" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#34D399">• Instant optical UDFPS fix</text>
  </g>
</svg>